<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ইন্টারনেট নেই — SB Telecom</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7f9fb;
        color: #212529;
        font-family: "Hind Siliguri", "Noto Sans Bengali", system-ui, sans-serif;
        padding: 24px;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0f1115; color: #e6e9ee; }
        .card { background: #171a21; border-color: #252a33; }
      }
      .card {
        max-width: 360px;
        width: 100%;
        background: #fff;
        border: 1px solid #e6ebf1;
        border-radius: 12px;
        padding: 28px 24px;
        text-align: center;
        box-shadow: 0 2px 12px rgba(16, 24, 40, 0.06);
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        border-radius: 50%;
        background: #00801a;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 { margin: 0 0 8px; font-size: 20px; }
      p { margin: 0 0 20px; font-size: 14.5px; line-height: 1.6; opacity: 0.75; }
      button {
        width: 100%;
        height: 44px;
        border: 0;
        border-radius: 8px;
        background: #00801a;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
      }
      button:active { transform: translateY(1px); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
          <path d="M1 1l22 22" />
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
          <path d="M12 20h.01" />
        </svg>
      </div>

      <h1>ইন্টারনেট নেই</h1>
      <p>
        হিসাব, স্টক আর বাকির তথ্য সবসময় সার্ভার থেকে আসে, তাই পুরনো সংখ্যা
        দেখানো হয় না। সংযোগ ফিরলেই আবার চেষ্টা করুন।
      </p>

      <button type="button" onclick="location.reload()">আবার চেষ্টা করুন</button>
    </div>

    <script>
      // come back on its own the moment the connection returns
      addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
